<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#B3D2DD">
  <title>RPI Crafts Club | Links</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page-doodle page-doodle--left" aria-hidden="true"></div>
  <div class="page-doodle page-doodle--right" aria-hidden="true"></div>

  <main class="scrapbook">
    <div class="paper-shadow" aria-hidden="true"></div>

    <section class="paper">
      <span class="tape tape--top-left" aria-hidden="true"></span>
      <span class="tape tape--top-right" aria-hidden="true"></span>

      <!-- Change image paths here if you rename or replace the artwork. -->
      <img class="decoration decoration--button" src="assets/blue_button.jpg" alt="">
      <img class="decoration decoration--flower" src="assets/blue_flower.jpg" alt="">
      <img class="rpi-sticker" src="assets/rpi_crafts_logo.png" alt="RPI logo in Crafts Club colors">

      <header class="club-header">
        <div class="logo-sticker">
          <img src="assets/craftsclub_logo.jpg" alt="Crafts Club yarn ball logo">
        </div>

        <!-- Change the club name and subtitle here. -->
        <p class="eyebrow">Rensselaer Polytechnic Institute</p>
        <h1>RPI Crafts Club</h1>
        <p class="subtitle"><span>Create</span><b>•</b><span>Build</span><b>•</b><span>Share</span></p>
      </header>

      <!-- Change the URLs below whenever the club's links change. -->
      <nav class="link-list" aria-label="RPI Crafts Club links">
        <a class="craft-link craft-link--discord" href="https://discord.gg/ZEKVpnhf5U" target="_blank" rel="noopener noreferrer">
          <span class="link-stitch" aria-hidden="true"></span>
          <span class="link-icon" aria-hidden="true">✦</span>
          <span class="link-copy">
            <strong>Join Our Discord</strong>
            <small>Chat, craft, and hang out</small>
          </span>
          <span class="link-arrow" aria-hidden="true">→</span>
        </a>

        <a class="craft-link craft-link--instagram" href="https://www.instagram.com/rpicraftsclub/" target="_blank" rel="noopener noreferrer">
          <span class="link-stitch" aria-hidden="true"></span>
          <span class="link-icon link-icon--instagram" aria-hidden="true">
            <span class="instagram-glyph"></span>
          </span>
          <span class="link-copy">
            <strong>Follow Our Instagram</strong>
            <small>See what we're making</small>
          </span>
          <span class="link-arrow" aria-hidden="true">→</span>
        </a>

        <a class="craft-link craft-link--linkedin" href="https://www.linkedin.com/in/crafts-club-6578a1406/" target="_blank" rel="noopener noreferrer">
          <span class="link-stitch" aria-hidden="true"></span>
          <span class="link-icon link-icon--letters" aria-hidden="true">in</span>
          <span class="link-copy">
            <strong>Connect on LinkedIn</strong>
            <small>Meet our creative community</small>
          </span>
          <span class="link-arrow" aria-hidden="true">→</span>
        </a>

        <div class="craft-link craft-link--website craft-link--coming-soon" aria-disabled="true">
          <span class="link-stitch" aria-hidden="true"></span>
          <span class="link-icon link-icon--website" aria-hidden="true">
            <span class="website-glyph"></span>
          </span>
          <span class="link-copy">
            <strong>Visit Our Website</strong>
            <small>Coming soon</small>
          </span>
          <span class="link-arrow" aria-hidden="true"></span>
        </div>

        <a class="craft-link craft-link--contact" href="mailto:rpicraftsclub@gmail.com">
          <span class="link-stitch" aria-hidden="true"></span>
          <span class="link-icon" aria-hidden="true">✉</span>
          <span class="link-copy">
            <strong>Contact Us</strong>
            <small>Questions, ideas, collaborations</small>
          </span>
          <span class="link-arrow" aria-hidden="true">→</span>
        </a>
      </nav>

    </section>
  </main>
</body>
</html>
